schemaVersion: 2.2.0

metadata:
  name: qwen25-opencode
  displayName: Qwen2.5 Code Assistant

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9

      memoryRequest: 1Gi
      memoryLimit: 4Gi

      cpuRequest: 500m
      cpuLimit: 2000m

      mountSources: true

      env:
        - name: QWEN_BASE_URL
          value: "https://redhataiqwen25-7b-instruct-qua-teste-gpu.apps.elpis.fazenda.mg.gov.br"

commands:
  - id: diagnose-environment
    exec:
      label: Diagnose workspace environment
      component: tools
      commandLine: |
        echo "===== Dev Spaces environment ====="
        echo "USER=$(whoami)"
        echo "HOME=$HOME"
        echo "PATH=$PATH"

        echo
        echo "bash:"
        command -v bash || true

        echo "node:"
        command -v node || true

        echo "npm:"
        command -v npm || true

        echo "curl:"
        command -v curl || true

        echo "jq:"
        command -v jq || true

        exit 0

events:
  postStart:
    - diagnose-environment