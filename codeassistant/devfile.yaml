schemaVersion: 2.3.0

metadata:
  name: ai-code-assistant
  displayName: AI Code Assistant
  description: >
    OpenShift Dev Spaces workspace prepared for
    OpenAI-compatible coding assistants.

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.29-1782991491

      memoryRequest: 2Gi
      memoryLimit: 6Gi

      cpuRequest: "1"
      cpuLimit: "4"

      mountSources: true

commands:

  # ---------------------------------------------------------
  # Bootstrap
  # ---------------------------------------------------------

  - id: bootstrap-ai-tools
    exec:
      label: Bootstrap AI Coding Tools
      component: tools
      commandLine: |
        set -u

        echo "=================================================="
        echo " AI Coding Workspace Bootstrap"
        echo "=================================================="

        echo "User: $(whoami)"
        echo "Home: $HOME"
        echo

        #
        # Check configuration
        #

        echo "AI Provider : ${AI_PROVIDER_NAME:-not configured}"
        echo "AI Base URL : ${AI_BASE_URL:-not configured}"
        echo "AI Model    : ${AI_MODEL:-not configured}"

        if [ -z "${AI_BASE_URL:-}" ] || [ -z "${AI_MODEL:-}" ]; then
          echo
          echo "WARNING:"
          echo "AI_BASE_URL or AI_MODEL is not configured."
          echo "Workspace will start normally."
          exit 0
        fi

        #
        # Install OpenCode
        #

        npm config set prefix "$HOME/.local"

        if ! command -v opencode >/dev/null 2>&1; then

          echo
          echo "Installing OpenCode..."

          if ! npm install -g opencode-ai@latest; then
            echo
            echo "WARNING: OpenCode installation failed."
            echo "Workspace will continue starting."
            exit 0
          fi

        fi

        echo
        echo "OpenCode:"
        command -v opencode
        opencode --version

        #
        # Generate OpenCode configuration
        #

        mkdir -p "$HOME/.config/opencode"

        node <<'NODE'
        const fs = require("fs");
        const path = require("path");

        const model = process.env.AI_MODEL;

        if (!model) {
          console.error("AI_MODEL not defined");
          process.exit(0);
        }

        const providerName =
          process.env.AI_PROVIDER_NAME || "OpenAI Compatible";

        const config = {
          "$schema": "https://opencode.ai/config.json",

          "model": `devspaces/${model}`,

          "provider": {
            "devspaces": {
              "npm": "@ai-sdk/openai-compatible",

              "name": providerName,

              "options": {
                "baseURL": "{env:AI_BASE_URL}",
                "apiKey": "{env:AI_API_KEY}"
              },

              "models": {
                [model]: {
                  "name": model
                }
              }
            }
          }
        };

        const home = process.env.HOME;
        const output =
          path.join(home, ".config", "opencode", "opencode.json");

        fs.writeFileSync(
          output,
          JSON.stringify(config, null, 2)
        );

        console.log(`Generated ${output}`);
        NODE

        echo
        echo "=================================================="
        echo " AI workspace ready"
        echo "=================================================="

        echo
        echo "Provider: ${AI_PROVIDER_NAME:-OpenAI Compatible}"
        echo "Model:    ${AI_MODEL}"
        echo "Endpoint: ${AI_BASE_URL}"
        echo

        exit 0


  # ---------------------------------------------------------
  # Connectivity test
  # ---------------------------------------------------------

  - id: test-ai-model
    exec:
      label: Test AI Model
      component: tools
      commandLine: |
        set -e

        echo "Testing:"
        echo "  ${AI_BASE_URL}"
        echo "  ${AI_MODEL}"
        echo

        curl -fsS \
          "${AI_BASE_URL}/chat/completions" \
          -H "Authorization: Bearer ${AI_API_KEY}" \
          -H "Content-Type: application/json" \
          -d "{
            \"model\": \"${AI_MODEL}\",
            \"messages\": [
              {
                \"role\": \"user\",
                \"content\": \"Reply exactly with: Dev Spaces AI connection OK\"
              }
            ],
            \"max_tokens\": 64
          }" | python3 -m json.tool


events:
  postStart:
    - bootstrap-ai-tools