schemaVersion: 2.3.0

metadata:
  name: qwen25-opencode
  displayName: Qwen2.5 Code Assistant
  description: >
    OpenShift Dev Spaces workspace with OpenCode configured
    to consume Qwen2.5 served by OpenShift AI / vLLM.

components:
  - name: tools
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:3.29-1782991491

      memoryRequest: 2Gi
      memoryLimit: 6Gi

      cpuRequest: "1"
      cpuLimit: "4"

      mountSources: true

      env:
        - name: QWEN_BASE_URL
          value: "https://redhataiqwen25-7b-instruct-qua-teste-gpu.apps.elpis.fazenda.mg.gov.br"

commands:
  - id: install-opencode
    exec:
      label: Install OpenCode
      component: tools
      commandLine: |
        set -eu

        echo "============================================"
        echo " OpenCode bootstrap"
        echo "============================================"

        echo "User: $(whoami)"
        echo "Home: $HOME"
        echo "Node: $(node --version)"
        echo "NPM:  $(npm --version)"

        npm config set prefix "$HOME/.local"

        if ! command -v opencode >/dev/null 2>&1; then
          echo
          echo "Installing OpenCode..."
          npm install -g opencode-ai@latest
        else
          echo
          echo "OpenCode already installed."
        fi

        echo
        echo "OpenCode:"
        command -v opencode
        opencode --version

        echo
        echo "============================================"
        echo " OpenCode ready"
        echo "============================================"

events:
  postStart:
    - install-opencode